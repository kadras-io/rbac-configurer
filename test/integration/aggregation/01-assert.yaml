---
# ...which are aggregated into the roles by the Kubernetes controller manager.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: supply-chain-workload
  labels:
    app.kubernetes.io/component: rbac-configurer
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        platform.kadras.io/aggregate-to-supply-chain-workload: "true"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: supply-chain-deliverable
  labels:
    app.kubernetes.io/component: rbac-configurer
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        platform.kadras.io/aggregate-to-supply-chain-deliverable: "true"
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
