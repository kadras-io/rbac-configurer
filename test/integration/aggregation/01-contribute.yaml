---
# Other packages contribute rules to the supply chain roles with ClusterRoles carrying the aggregation labels...
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: test-supply-chain-workload
  labels:
    platform.kadras.io/aggregate-to-supply-chain-workload: "true"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: test-supply-chain-deliverable
  labels:
    platform.kadras.io/aggregate-to-supply-chain-deliverable: "true"
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
